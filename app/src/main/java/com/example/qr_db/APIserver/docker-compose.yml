version: '3.8'
services:
  app:
    build: ../data
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=your_user
      - DB_PASSWORD=your_password
    depends_on:
      - db
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=your_user
      - POSTGRES_PASSWORD=your_password
      - POSTGRES_DB=qr_db
    ports:
      - "5432:5432"