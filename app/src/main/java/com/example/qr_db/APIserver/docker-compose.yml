version: '3.8'

services:
  db:
    image: postgres:15
    container_name: smartcheck_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: SmartCheck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql   # ← ВАЖНО

  app:
    build: .
    container_name: smartcheck_api
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: 123456
      DB_NAME: SmartCheck
    depends_on:
      - db

volumes:
  postgres_data: