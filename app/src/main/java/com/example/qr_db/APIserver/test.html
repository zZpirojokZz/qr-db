<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест импорта расписания</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background: #f4f6f9; }
        .container { background: white; padding: 30px; border-radius: 8px; max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { display: block; width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        textarea { width: 100%; height: 120px; margin-top: 10px; resize: none; font-family: monospace; background: #eee; }
    </style>
</head>
<body>

<div class="container">
<h3>Импорт расписания из Excel</h3>
    
    <label>1. Вставь сюда Token Администрации:</label>
    <input type="text" id="token" placeholder="Вставь токен сюда...">



    <label>2. Скачай эталонный шаблон (если необходимо):</label>
    <button onclick="downloadTemplate()" style="background: #28a745; margin-bottom: 25px;">Скачать шаблон .xlsx</button>

    <label>3. Выбери Excel-файл расписания:</label>
    <input type="file" id="excelFile" accept=".xlsx">

    <button onclick="uploadFile()">Отправить файл на сервер</button>

    <label>Ответ сервера:</label>
    <textarea id="result" readonly></textarea>
</div>

<script>
async function uploadFile() {
    let tokenInput = document.getElementById('token').value.trim();
    const fileInput = document.getElementById('excelFile').files[0];
    const resultBox = document.getElementById('result');

    if (!tokenInput || !fileInput) {
        alert('Пожалуйста, вставьте токен и выберите файл!');
        return;
    }

    // Умная очистка токена от возможных кавычек и слова Bearer
    tokenInput = tokenInput.replace(/^["']|["']$/g, ''); 
    if (tokenInput.toLowerCase().startsWith('bearer ')) {
        tokenInput = tokenInput.slice(7).trim(); 
    }

    const formData = new FormData();
    formData.append('file', fileInput);

    resultBox.value = "Отправка запроса...";

    try {
        // Если сервер вернул ошибку текстом

            const errorText = await response.text();
            resultBox.value = `Ошибка сервера (Статус ${response.status}):\n${errorText}`;
            return;
        }

        const data = await response.json();
        resultBox.value = JSON.stringify(data, null, 2);
    } catch (error) {
        resultBox.value = "Ошибка соединения: " + error.message;
    }
}

// Функция скачивания примера расписания
function downloadTemplate() {
    window.location.href = 'http://localhost:3000/import/template';
}
</script>

</body>
</html>
